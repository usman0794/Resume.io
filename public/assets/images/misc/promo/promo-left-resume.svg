<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 260" fill="none">
  <!-- Resume document stack, left-facing promo illustration -->
  <rect x="40" y="30" width="160" height="200" rx="12" fill="#f9f0e6" stroke="#e8d5c0" stroke-width="2"/>
  <rect x="55" y="45" width="130" height="170" rx="10" fill="white" stroke="#e0cdb8" stroke-width="1.5"/>
  <!-- Photo circle -->
  <circle cx="90" cy="80" r="22" fill="#dbeafe"/>
  <circle cx="90" cy="72" r="10" fill="#93c5fd"/>
  <ellipse cx="90" cy="94" rx="14" ry="8" fill="#93c5fd"/>
  <!-- Name lines -->
  <rect x="120" y="68" width="55" height="7" rx="3" fill="#1e40af" opacity="0.8"/>
  <rect x="120" y="80" width="42" height="5" rx="2.5" fill="#3b82f6" opacity="0.5"/>
  <rect x="120" y="90" width="48" height="5" rx="2.5" fill="#93c5fd" opacity="0.5"/>
  <!-- Divider -->
  <line x1="65" y1="115" x2="175" y2="115" stroke="#e5e7eb" stroke-width="1.5"/>
  <!-- Experience lines -->
  <rect x="65" y="125" width="35" height="5" rx="2.5" fill="#374151" opacity="0.7"/>
  <rect x="65" y="135" width="100" height="4" rx="2" fill="#9ca3af" opacity="0.6"/>
  <rect x="65" y="143" width="85" height="4" rx="2" fill="#9ca3af" opacity="0.5"/>
  <rect x="65" y="151" width="92" height="4" rx="2" fill="#9ca3af" opacity="0.4"/>
  <rect x="65" y="167" width="35" height="5" rx="2.5" fill="#374151" opacity="0.7"/>
  <rect x="65" y="177" width="100" height="4" rx="2" fill="#9ca3af" opacity="0.5"/>
  <rect x="65" y="185" width="75" height="4" rx="2" fill="#9ca3af" opacity="0.4"/>
  <!-- Decorative blobs -->
  <circle cx="255" cy="50" r="28" fill="#fde68a" opacity="0.6"/>
  <circle cx="268" cy="200" r="20" fill="#a7f3d0" opacity="0.5"/>
  <circle cx="20" cy="180" r="15" fill="#fbcfe8" opacity="0.5"/>
</svg>
