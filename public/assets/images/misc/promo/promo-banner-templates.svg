<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Promo banner - multiple resume template cards -->
  <rect x="10" y="20" width="100" height="140" rx="8" fill="white" stroke="#e5e7eb" stroke-width="1.5" transform="rotate(-5 60 90)"/>
  <rect x="12" y="22" width="96" height="30" rx="4" fill="#3b82f6" transform="rotate(-5 60 90)"/>
  <rect x="20" y="58" width="80" height="5" rx="2.5" fill="#9ca3af" opacity="0.6" transform="rotate(-5 60 90)"/>
  <rect x="20" y="68" width="70" height="4" rx="2" fill="#d1d5db" transform="rotate(-5 60 90)"/>
  <rect x="20" y="77" width="75" height="4" rx="2" fill="#d1d5db" transform="rotate(-5 60 90)"/>
  <!-- Middle card -->
  <rect x="120" y="15" width="110" height="155" rx="8" fill="white" stroke="#e5e7eb" stroke-width="2"/>
  <rect x="120" y="15" width="110" height="38" rx="4" fill="#1e40af"/>
  <circle cx="145" cy="34" r="12" fill="#93c5fd"/>
  <rect x="162" y="27" width="55" height="6" rx="3" fill="white" opacity="0.8"/>
  <rect x="162" y="37" width="40" height="4" rx="2" fill="white" opacity="0.5"/>
  <rect x="130" y="65" width="90" height="4" rx="2" fill="#9ca3af" opacity="0.6"/>
  <rect x="130" y="74" width="80" height="4" rx="2" fill="#d1d5db"/>
  <rect x="130" y="83" width="85" height="4" rx="2" fill="#d1d5db"/>
  <rect x="130" y="99" width="90" height="4" rx="2" fill="#9ca3af" opacity="0.6"/>
  <rect x="130" y="108" width="75" height="4" rx="2" fill="#d1d5db"/>
  <rect x="130" y="117" width="82" height="4" rx="2" fill="#d1d5db"/>
  <rect x="130" y="133" width="90" height="4" rx="2" fill="#9ca3af" opacity="0.6"/>
  <rect x="130" y="142" width="60" height="4" rx="2" fill="#d1d5db"/>
  <!-- Right card -->
  <rect x="250" y="25" width="105" height="140" rx="8" fill="white" stroke="#e5e7eb" stroke-width="1.5" transform="rotate(4 302 95)"/>
  <rect x="250" y="25" width="105" height="33" rx="4" fill="#7c3aed" transform="rotate(4 302 95)"/>
  <rect x="260" y="65" width="85" height="4" rx="2" fill="#9ca3af" opacity="0.5" transform="rotate(4 302 95)"/>
  <rect x="260" y="74" width="75" height="4" rx="2" fill="#d1d5db" transform="rotate(4 302 95)"/>
  <!-- Stars rating -->
  <text x="120" y="200" font-size="22" fill="#fbbf24">★★★★★</text>
  <text x="130" y="220" font-size="13" fill="#6b7280" font-family="sans-serif">4.8 / 55,000+ reviews</text>
  <!-- Decorative elements -->
  <circle cx="370" cy="40" r="18" fill="#fde68a" opacity="0.6"/>
  <circle cx="20" cy="250" r="14" fill="#a7f3d0" opacity="0.5"/>
</svg>
